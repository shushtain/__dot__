env = PATH,$HOME/.bin:$HOME/.nix-profile/bin:$HOME/.local/bin:$HOME/.cargo/bin:$HOME/.npm-global/bin:$PATH

env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland
env = XDG_SESSION_DESKTOP,Hyprland

env = LIBVA_DRIVER_NAME,radeonsi
env = VDPAU_DRIVER,radeonsi
env = RADV_PERFTEST,video_decode
env = AMD_VULKAN_ICD,RADV
# env = HYPRLAND_NO_SD_EVENT,0

env = GDK_BACKEND,wayland,x11,*
env = GDK_SCALE,1
env = QT_QPA_PLATFORM,wayland;xcb
env = QT_WAYLAND_DISABLE_WINDOWDECORATION,1
env = SDL_VIDEODRIVER,wayland
env = CLUTTER_BACKEND,wayland

envd = XCURSOR_SIZE,24
envd = HYPRCURSOR_SIZE,24
envd = XCURSOR_THEME,Bibata-Modern-Ice
envd = HYPRCURSOR_THEME,Bibata-Modern-Ice
envd = GTK_THEME,Adwaita:dark

envd = EDITOR,nvim
envd = GIT_EDITOR,nvim
envd = VISUAL,nvim
envd = BROWSER,firefox
envd = TERMINAL,alacritty

envd = XDG_DESKTOP_DIR,$HOME/lot
envd = XDG_DOCUMENTS_DIR,$HOME/lot
envd = XDG_DOWNLOAD_DIR,$HOME/lot
envd = XDG_MUSIC_DIR,$HOME/lot
envd = XDG_PICTURES_DIR,$HOME/lot
envd = XDG_PUBLICSHARE_DIR,$HOME/pub
envd = XDG_TEMPLATES_DIR,$HOME/tpl
envd = XDG_VIDEOS_DIR,$HOME/lot
envd = XDG_CLOUD_DIR,$HOME/box
